name: DailyBoard
options:
  bundleIdPrefix: com.isterkh
  deploymentTarget:
    macOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    CODE_SIGNING_ALLOWED: NO
targets:
  DailyBoard:
    type: application
    platform: macOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.isterkh.DailyBoard
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Tasks
        MACOSX_DEPLOYMENT_TARGET: '26.0'
        SWIFT_STRICT_CONCURRENCY: complete
    scheme:
      testTargets:
        - DailyBoardTests
  DailyBoardTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: DailyBoard
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
